name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history needed for changelog generation

      - name: Validate release version
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CLI_VERSION="$(bash bin/aito --version | awk '{print $2}')"
          if [ "$TAG_VERSION" != "$CLI_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match CLI version $CLI_VERSION" >&2
            exit 1
          fi
          if ! grep -Fq "## [$TAG_VERSION]" CHANGELOG.md; then
            echo "CHANGELOG.md has no release section for $TAG_VERSION" >&2
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section for this release
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Try to find a section header matching the tag version
          SECTION=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          if [ -z "$SECTION" ]; then
            # Fall back to the [Unreleased] section
            SECTION=$(awk '/^## \[Unreleased\]/{found=1; next} found && /^## /{exit} found{print}' CHANGELOG.md)
          fi
          # Write to a file to avoid quoting issues
          printf '%s' "$SECTION" > /tmp/release-notes.md
          echo "notes_file=/tmp/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Generate commit log (fallback if changelog section is empty)
        run: |
          if [ ! -s /tmp/release-notes.md ]; then
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" >> /tmp/release-notes.md
            else
              git log --pretty=format:"- %s (%h)" >> /tmp/release-notes.md
            fi
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: "v${{ steps.version.outputs.version }}"
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
